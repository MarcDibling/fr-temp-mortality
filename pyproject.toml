[project]
name = "frtm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.4.5",
    "fastexcel>=0.16.0",
    "holidays>=0.83",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandera>=0.26.1",
    "polars>=1.36.1",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
frtm = "frtm:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/frtm"]
